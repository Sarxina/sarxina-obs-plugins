Gate.Open="Open threshold"
Gate.Open.Help="The level (RMS over 10 ms) that opens the gate. Default -50 dB: the voice is left alone from there up."
Gate.Close="Close threshold"
Gate.Close.Help="The gate starts to close only under this level. Lower than the open threshold, so a word that dips does not flutter it. Default -56 dB."
Gate.Range="Range"
Gate.Range.Help="How far down the closed gate turns the sound. Default -30 dB."
Gate.Attack="Attack"
Gate.Attack.Help="Time from closed to fully open. Default 2 ms."
Gate.Hold="Hold"
Gate.Hold.Help="How long the gate stays open after the level drops under the close threshold, so word tails and short gaps stay whole. Default 150 ms."
Gate.Release="Release"
Gate.Release.Help="Time from open to closed, so tails and breaths fade out instead of being cut off. Default 250 ms."
Gate.LookAhead="Look-ahead"
Gate.LookAhead.Help="The sound is delayed by this much so the gate is open before a word starts. Default 5 ms."

