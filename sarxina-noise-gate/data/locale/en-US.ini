FilterName="Sarxina Noise Gate"
Description="A voice noise gate: the voice passes untouched, the room under it is turned far down, without cutting words or breaths."
Open="Open threshold"
Open.Help="The level (RMS over 10 ms) that opens the gate. Default -50 dB: the voice is left alone from there up."
Close="Close threshold"
Close.Help="The gate starts to close only under this level. Lower than the open threshold, so a word that dips does not flutter it. Default -56 dB."
Range="Range"
Range.Help="How far down the closed gate turns the sound. Default -30 dB."
Attack="Attack"
Attack.Help="Time from closed to fully open. Default 2 ms."
Hold="Hold"
Hold.Help="How long the gate stays open after the level drops under the close threshold, so word tails and short gaps stay whole. Default 150 ms."
Release="Release"
Release.Help="Time from open to closed, so tails and breaths fade out instead of being cut off. Default 250 ms."
LookAhead="Look-ahead"
LookAhead.Help="The sound is delayed by this much so the gate is open before a word starts. Default 5 ms."
